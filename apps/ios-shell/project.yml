name: PastelRTS
options:
  bundleIdPrefix: com.pastelrts
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.pastelrts.app
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "2"
    SUPPORTS_MAC_DESIGNED_FOR_IPAD: NO
    INFOPLIST_FILE: PastelRTS/Info.plist
    SWIFT_VERSION: "5.9"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.0.1
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  PastelRTS:
    type: application
    platform: iOS
    sources:
      - path: PastelRTS
        excludes:
          - "WebGame/**"
      - path: PastelRTS/WebGame
        buildPhase: resources
        optional: true
        type: folder
    settings:
      base:
        PRODUCT_NAME: PastelRTS
        INFOPLIST_KEY_CFBundleDisplayName: Pastel RTS
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIDeviceFamily: 2
    info:
      path: PastelRTS/Info.plist
      properties:
        CFBundleDisplayName: Pastel RTS
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
