name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web typecheck, test, build, Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Visual and interaction tests (developer studio)
        run: npx playwright test
        env:
          CI: true
          PLAYWRIGHT_SERVER_MODE: dev
      - name: Production preview offline verification
        run: npx playwright test apps/game-web/e2e/m11c-baseline.spec.ts --project=chromium --grep "M1.1-C production preview boots with content server stopped"
        env:
          CI: true
          PLAYWRIGHT_SERVER_MODE: preview
          PLAYWRIGHT_SKIP_CONTENT_SERVER: '1'
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

  ios:
    name: iOS simulator compile
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install JS workspaces
        run: npm ci
      - name: Production web build for bundle
        run: npm run build --workspace @pastel-rts/game-web
      - name: Sync web build into iOS resources
        run: npm run ios:sync-web
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: (cd apps/ios-shell && xcodegen generate)
      - name: Compile for iOS Simulator
        run: |
          xcodebuild \
            -project apps/ios-shell/PastelRTS.xcodeproj \
            -scheme PastelRTS \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
